<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DigitalRecount — PjBL Recount Text (Supabase)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --primary:#7c3aed;--primary-light:#a855f7;--primary-lighter:#c084fc;--primary-soft:#ede9fe;
  --grad:linear-gradient(135deg,#7c3aed 0%,#a855f7 50%,#c084fc 100%);
  --grad-soft:linear-gradient(135deg,#ede9fe 0%,#f5f3ff 100%);
  --bg:#f7f5ff;--bg-2:#fff;--card:#fff;--text:#1e1b4b;--text-muted:#6b7280;--border:#e9e5f5;
  --shadow:0 4px 20px rgba(124,58,237,.08);--shadow-lg:0 10px 40px rgba(124,58,237,.15);
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--info:#3b82f6;
  --radius:16px;--radius-sm:10px;
  --sidebar-w:250px;
}
[data-theme="dark"]{
  --primary:#a855f7;--primary-light:#c084fc;--primary-lighter:#ddd6fe;--primary-soft:#2d1b4e;
  --grad:linear-gradient(135deg,#6d28d9 0%,#7c3aed 50%,#a855f7 100%);
  --grad-soft:linear-gradient(135deg,#1e1147 0%,#2d1b4e 100%);
  --bg:#0c0718;--bg-2:#150a2e;--card:#1a1033;--text:#f1f5f9;--text-muted:#a5a3c0;--border:#2d1b4e;
  --shadow:0 4px 20px rgba(0,0,0,.4);--shadow-lg:0 10px 40px rgba(0,0,0,.5);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .3s,color .3s;overflow-x:hidden}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary);text-decoration:none}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:var(--primary-light)}

/* ============================================================
   SIDEBAR (desktop only)
============================================================ */
.sidebar{
  display:none;position:fixed;left:0;top:0;bottom:0;width:var(--sidebar-w);
  background:var(--bg-2);border-right:1px solid var(--border);z-index:150;
  flex-direction:column;transition:transform .3s,background .3s,border-color .3s;
}
.sidebar-brand{
  display:flex;align-items:center;gap:10px;padding:16px 18px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.sidebar-brand .brand-icon{
  width:38px;height:38px;border-radius:11px;background:var(--grad);
  display:grid;place-items:center;color:#fff;font-size:16px;
  box-shadow:0 6px 16px rgba(124,58,237,.3);flex-shrink:0;
}
.sidebar-brand .brand-text{
  font-weight:800;font-size:17px;letter-spacing:-.02em;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;cursor:pointer;
}
.sidebar-nav{
  flex:1;overflow-y:auto;padding:12px 10px;display:flex;flex-direction:column;gap:3px;
}
.sidebar-nav::-webkit-scrollbar{width:6px}
.sidebar-nav a{
  display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:11px;
  color:var(--text-muted);font-weight:500;font-size:14px;transition:all .2s;
  white-space:nowrap;
}
.sidebar-nav a i{width:18px;text-align:center;font-size:15px}
.sidebar-nav a:hover{background:var(--primary-soft);color:var(--primary)}
.sidebar-nav a.active{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.3);font-weight:600}
.sidebar-nav a.active i{color:#fff}
.sidebar-section-label{
  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
  color:var(--text-muted);padding:12px 14px 6px;opacity:.7;
}
.sidebar-footer{
  padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px;
}
.sidebar-footer-row{display:flex;gap:8px;align-items:center}
.sidebar-footer-row .lang-toggle{flex:1}
.sidebar-footer-row .icon-btn{width:36px;height:36px}

/* Sidebar credit */
.sidebar-credit{
  padding:10px 12px;text-align:center;
  background:var(--grad-soft);border-radius:12px;
  border:1px solid var(--border);
}
.sidebar-credit .credit-label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.08em;color:var(--text-muted);margin-bottom:4px;
}
.sidebar-credit .credit-name{
  font-size:12.5px;font-weight:800;color:var(--primary);
  line-height:1.3;margin-bottom:2px;
}
.sidebar-credit .credit-sub{
  font-size:10.5px;color:var(--text-muted);line-height:1.4;
}

/* Layout wrapping */
.main-wrap{margin-left:0;transition:margin-left .3s}
@media(min-width:901px){
  .sidebar{display:flex}
  .main-wrap{margin-left:var(--sidebar-w)}
}

/* ============================================================
   TOPBAR
============================================================ */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg-2);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.topbar-inner{max-width:1280px;margin:0 auto;padding:11px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;cursor:pointer;flex-shrink:0}
.brand-icon{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;font-size:16px;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.desktop-nav{display:none}
.topbar-actions{display:flex;align-items:center;gap:6px;margin-left:auto}
.icon-btn{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:15px;color:var(--text-muted);background:var(--bg);border:1px solid var(--border);transition:all .2s;position:relative}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-2px)}
.avatar-btn{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:17px;font-weight:700;box-shadow:0 4px 14px rgba(124,58,237,.3);transition:transform .2s}
.avatar-btn:hover{transform:scale(1.05)}
.lang-toggle{display:flex;background:var(--bg);border:1px solid var(--border);border-radius:11px;overflow:hidden;height:38px}
.lang-toggle button{padding:0 10px;font-size:12px;font-weight:700;color:var(--text-muted);transition:all .2s}
.lang-toggle button.active{background:var(--grad);color:#fff}
.lang-toggle button:not(.active):hover{background:var(--primary-soft);color:var(--primary)}
/* Topbar lang-toggle: tampil di desktop juga (dipindah dari sidebar) */
@media(min-width:901px){
  .topbar .lang-toggle{display:flex}
}
@media(max-width:900px){
  .topbar .brand{display:flex}
}

main{max-width:1280px;margin:0 auto;padding:22px 16px 110px;min-height:calc(100vh - 62px);animation:fadeIn .4s}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--border);padding:20px;box-shadow:var(--shadow);transition:all .3s}
.card:hover{box-shadow:var(--shadow-lg)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:11px 20px;border-radius:12px;font-weight:600;font-size:13.5px;transition:all .2s;white-space:nowrap}
.btn-primary{background:var(--grad);color:#fff;box-shadow:0 6px 20px rgba(124,58,237,.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 28px rgba(124,58,237,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--primary);color:var(--primary)}
.btn-danger{background:var(--danger);color:#fff}
.btn-success{background:var(--success);color:#fff}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:9px}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.badge-success{background:rgba(16,185,129,.15);color:var(--success)}
.badge-warning{background:rgba(245,158,11,.15);color:var(--warning)}
.badge-primary{background:var(--primary-soft);color:var(--primary)}
.badge-muted{background:var(--bg);color:var(--text-muted);border:1px solid var(--border)}
.badge-info{background:rgba(59,130,246,.15);color:var(--info)}
.section-title{font-size:21px;font-weight:800;letter-spacing:-.02em;margin-bottom:5px}
.section-sub{color:var(--text-muted);font-size:14px;margin-bottom:18px}
.input,.textarea,.select{width:100%;padding:11px 15px;background:var(--bg);border:1.5px solid var(--border);border-radius:11px;font-size:14px;transition:all .2s;color:var(--text)}
.input:focus,.textarea:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,58,237,.12);background:var(--bg-2)}
.textarea{min-height:120px;resize:vertical;line-height:1.7}
.label{display:block;font-weight:600;font-size:12.5px;margin-bottom:6px;color:var(--text)}
.field{margin-bottom:14px}
.hint{font-size:11.5px;color:var(--text-muted);margin-top:4px}

.tabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:9px 14px;border-radius:9px 9px 0 0;font-weight:600;font-size:13px;color:var(--text-muted);transition:all .2s;white-space:nowrap;border-bottom:2.5px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--primary);background:var(--primary-soft)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

.hero{background:var(--grad);border-radius:22px;padding:32px 26px;color:#fff;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:var(--shadow-lg)}
.hero::before,.hero::after{content:'';position:absolute;border-radius:50%;background:rgba(255,255,255,.1)}
.hero::before{width:280px;height:280px;top:-140px;right:-80px}
.hero::after{width:180px;height:180px;bottom:-110px;right:180px}
.hero-content{position:relative;z-index:1}
.hero h1{font-size:28px;font-weight:800;margin-bottom:6px;letter-spacing:-.02em}
.hero p{opacity:.95;font-size:14.5px;max-width:600px}
.hero-actions{margin-top:18px;display:flex;gap:9px;flex-wrap:wrap}
.hero-actions .btn-primary{background:#fff;color:var(--primary)}
.hero-actions .btn-ghost{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.3)}
.hero-actions .btn-ghost:hover{background:rgba(255,255,255,.25);border-color:#fff;color:#fff}

.progress-wrap{display:grid;grid-template-columns:220px 1fr;gap:22px;margin-bottom:22px}
.progress-ring{position:relative;width:180px;height:180px;margin:0 auto}
.progress-ring svg{transform:rotate(-90deg)}
.progress-ring-circle{transition:stroke-dashoffset .8s ease}
.progress-ring-label{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.progress-ring-label .num{font-size:34px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.progress-ring-label .txt{font-size:11.5px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.steps-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.step-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;transition:all .25s;position:relative;overflow:hidden}
.step-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:var(--grad);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.step-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:var(--primary-light)}
.step-card:hover::before{transform:scaleX(1)}
.step-card.done{border-color:var(--success)}
.step-card.done::before{background:var(--success);transform:scaleX(1)}
.step-num{width:40px;height:40px;border-radius:11px;background:var(--grad-soft);color:var(--primary);display:grid;place-items:center;font-weight:800;font-size:15px;margin-bottom:10px}
.step-card.done .step-num{background:var(--grad);color:#fff}
.step-card h3{font-size:15px;font-weight:700;margin-bottom:3px}
.step-card p{font-size:12.5px;color:var(--text-muted)}
.step-status{position:absolute;top:14px;right:14px;font-size:17px}

.lock-overlay{position:absolute;inset:0;background:rgba(30,27,75,.55);backdrop-filter:blur(3px);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;border-radius:var(--radius);z-index:2;text-align:center;padding:20px;gap:6px}
.lock-overlay i{font-size:34px;margin-bottom:4px;opacity:.95}
.lock-overlay .lock-title{font-weight:700;font-size:14px}
.lock-overlay .lock-sub{font-size:11.5px;opacity:.9;max-width:220px}
.step-card.locked{cursor:not-allowed}
.step-card.locked:hover{transform:none}

.quiz-text{background:var(--grad-soft);padding:18px;border-radius:13px;line-height:1.9;font-size:14.5px;margin-bottom:16px;border-left:4px solid var(--primary)}
.quiz-text em,.hl{color:var(--primary);font-style:normal;font-weight:600;background:rgba(124,58,237,.1);padding:1px 5px;border-radius:5px;cursor:pointer;transition:all .2s}
.quiz-text em:hover,.hl:hover{background:var(--primary);color:#fff}
.quiz-option{display:block;padding:13px 16px;background:var(--bg);border:1.5px solid var(--border);border-radius:11px;margin-bottom:9px;cursor:pointer;transition:all .2s;font-size:13.5px}
.quiz-option:hover{border-color:var(--primary-light);background:var(--primary-soft)}
.quiz-option.selected{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);font-weight:600}
.quiz-option.correct{border-color:var(--success);background:rgba(16,185,129,.1);color:var(--success);font-weight:600}
.quiz-option.wrong{border-color:var(--danger);background:rgba(239,68,68,.1);color:var(--danger);font-weight:600}

.tense-table{width:100%;border-collapse:collapse;font-size:13.5px;margin-bottom:14px}
.tense-table th,.tense-table td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);vertical-align:top}
.tense-table th{background:var(--grad-soft);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--text-muted);font-weight:700}
.tense-table td:nth-child(2){font-family:'Courier New',monospace;font-weight:700;color:var(--primary);font-size:12.5px}
.tense-table td:nth-child(3){font-style:italic;font-size:13px}
.tense-alert{background:linear-gradient(135deg,#fef3c7,#fde68a);border-left:4px solid #f59e0b;padding:14px 16px;border-radius:10px;color:#78350f;font-size:13px;line-height:1.7;margin-top:12px}
.tense-alert b{color:#92400e}

.dd-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dd-zone{background:var(--bg);border:2px dashed var(--border);border-radius:13px;padding:14px;min-height:170px;transition:all .2s}
.dd-zone.drag-over{border-color:var(--primary);background:var(--primary-soft)}
.dd-zone h4{font-size:13px;margin-bottom:10px;font-weight:700;display:flex;align-items:center;gap:7px}
.dd-zone.regular h4{color:var(--info)}
.dd-zone.irregular h4{color:var(--warning)}
.dd-items{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.dd-item{padding:8px 14px;background:var(--card);border:1.5px solid var(--border);border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;user-select:none}
.dd-item:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:var(--shadow)}
.dd-item.used{opacity:.3;pointer-events:none}
.dd-item.dragging{opacity:.5;border-color:var(--primary)}
.dd-chip{padding:7px 12px;background:var(--card);border:1.5px solid var(--border);border-radius:8px;font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px;margin:3px}
.dd-chip.correct{border-color:var(--success);background:rgba(16,185,129,.1);color:var(--success)}

.timeline{position:relative;padding-left:28px}
.timeline::before{content:'';position:absolute;left:11px;top:6px;bottom:6px;width:2px;background:var(--grad)}
.tl-item{position:relative;margin-bottom:18px;padding-left:8px}
.tl-item::before{content:'';position:absolute;left:-22px;top:5px;width:16px;height:16px;border-radius:50%;background:var(--grad);border:3px solid var(--bg-2);box-shadow:0 0 0 2px var(--primary-light)}
.tl-item h4{font-size:12.5px;font-weight:700;color:var(--primary);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}

.storyboard-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.sb-card{background:var(--bg);border:1.5px solid var(--border);border-radius:12px;overflow:hidden;position:relative}
.sb-thumb{height:120px;background:var(--grad-soft);display:grid;place-items:center;font-size:32px;overflow:hidden}
.sb-thumb img{width:100%;height:100%;object-fit:cover}
.sb-cap{padding:8px;font-size:12px}
.sb-del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;font-size:11px;cursor:pointer;z-index:2}

.audio-rec{display:flex;align-items:center;gap:12px;padding:14px;background:var(--bg);border-radius:13px;border:1.5px solid var(--border)}
.rec-btn{width:52px;height:52px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer;transition:all .2s;box-shadow:0 6px 16px rgba(124,58,237,.3)}
.rec-btn.recording{background:var(--danger);animation:pulse 1.2s infinite}
.rec-info{flex:1}
.rec-info .title{font-weight:700;font-size:14px}
.rec-info .sub{font-size:12px;color:var(--text-muted)}

.chat-wrap{display:flex;flex-direction:column;height:500px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.chat-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:var(--grad-soft)}
.chat-head .avatar{width:38px;height:38px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;font-size:17px}
.chat-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:82%;padding:11px 15px;border-radius:13px;font-size:13.5px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:var(--grad);color:#fff;border-radius:13px 13px 3px 13px}
.msg.ai{align-self:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:13px 13px 13px 3px}
.msg.sys{align-self:center;background:var(--primary-soft);color:var(--primary);font-size:12px;padding:6px 12px;border-radius:999px}
.chat-input{padding:12px;border-top:1px solid var(--border);display:flex;gap:8px;align-items:flex-end}
.chat-input textarea{flex:1;min-height:42px;max-height:120px;resize:none;padding:10px 14px}
.chat-send{width:42px;height:42px;border-radius:11px;background:var(--grad);color:#fff;display:grid;place-items:center;flex-shrink:0}

.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.badge-item{background:var(--card);border:1.5px solid var(--border);border-radius:13px;padding:14px 10px;text-align:center;transition:all .2s;position:relative;overflow:hidden}
.badge-item.locked{opacity:.45;filter:grayscale(.85)}
.badge-item.unlocked{border-color:var(--primary);box-shadow:0 4px 14px rgba(124,58,237,.15)}
.badge-item.unlocked::before{content:'✓';position:absolute;top:6px;right:8px;width:18px;height:18px;background:var(--grad);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700}
.badge-item.locked::after{content:'🔒';position:absolute;top:6px;right:8px;font-size:14px;opacity:.6}
.badge-item.unlocked::after{content:'';position:absolute;top:-50%;right:-50%;width:200%;height:200%;background:radial-gradient(circle,rgba(168,85,247,.15) 0%,transparent 60%);pointer-events:none;animation:badgeGlow 3s ease-in-out infinite}
@keyframes badgeGlow{0%,100%{opacity:.4}50%{opacity:1}}
.badge-emoji{font-size:30px;margin-bottom:6px;display:block}
.badge-name{font-size:12px;font-weight:700;margin-bottom:2px}
.badge-desc{font-size:10.5px;color:var(--text-muted);line-height:1.4}
.badge-progress{font-size:10px;color:var(--primary);font-weight:600;margin-top:4px}

.gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}

const Supabase={
  queue:null,
  isReady(){ return !!sb; },
  queueSync(){
    if(!sb) return;
    clearTimeout(this.queue);
    this.queue = setTimeout(() => this.sync(), 1500);
  },
  async sync(){
    if(!sb) return;
    try{
      const u = U();
      const payload = {
        id: u.id,
        class_code: State.classCode || 'default',
        profile_name: u.profile.name || '',
        profile_role: u.profile.role || 'teacher',
        profile_nip: u.profile.nip || '',
        profile_school: u.profile.school || '',
        profile_classes: u.profile.classes || '',
        profile_avatar: u.profile.avatar || '',
        progress: u.progress, quiz: u.quiz, t1: u.t1, t2: u.t2, t3: u.t3, t4: u.t4,
        badges: u.badges,
        updated_at: new Date().toISOString()
      };
      const { error } = await sb.from('users').upsert(payload, { onConflict: 'id' });
      if(error) throw error;
      console.log('[Supabase] Sync OK');
    }catch(e){ console.warn('[Supabase] Sync error:', e.message); }
  },
  async test(){
    if(!sb) return toast('Supabase belum di-setup','fa-triangle-exclamation');
    try{
      toast('Testing...','fa-spinner');
      const { data, error } = await sb.from('users').select('id').limit(1);
      if(error) throw error;
      toast('✓ Supabase aktif','fa-check');
    }catch(e){ toast('Error: '+e.message,'fa-xmark'); }
  },
  async fetchConfig(){
    if(!sb) return null;
    try{
      const { data, error } = await sb.from('config').select('key,value');
      if(error) throw error;
      const cfg = {};
      (data||[]).forEach(row => cfg[row.key] = row.value);
      return cfg;
    }catch(e){ console.warn('[Supabase] fetchConfig:', e.message); return null; }
  },
  async fetchMaterials(){
    if(!sb) return null;
    try{
      const { data, error } = await sb.from('materials').select('*').eq('id','default').maybeSingle();
      if(error && error.code !== 'PGRST116') throw error;
      return data || null;
    }catch(e){ console.warn('[Supabase] fetchMaterials:', e.message); return null; }
  },
  async saveMaterials(data){
    if(!sb) return { ok:false, error:'Supabase belum siap' };
    try{
      const { error } = await sb.from('materials').upsert({
        id: 'default',
        reading_text: data.readingText || '',
        quizzes: data.quizzes || [],
        video_url: data.videoUrl || '',
        video_title: data.videoTitle || '',
        updated_at: new Date().toISOString()
      }, { onConflict: 'id' });
      if(error) throw error;
      return { ok:true };
    }catch(e){ return { ok:false, error: e.message }; }
  },
  async fetchAllUsers(){
    if(!sb) return [];
    try{
      const { data, error } = await sb.from('users').select('*').order('updated_at',{ascending:false});
      if(error) throw error;
      return (data||[]).map(row => ({
        id: row.id,

        badges: row.badges || [], updated_at: row.updated_at
      }));
    }catch(e){ console.warn('[Supabase] fetchAllUsers:', e.message); return []; }

  async uploadFile(bucket, path, file){
    if(!sb) return { ok:false, error: 'Supabase not ready' };

      return { ok:true, url: urlData.publicUrl };
    }catch(e){ return { ok:false, error: e.message }; }

============================================================ */
const AI={
  async chat(prompt){
    const s = State.settings;
    const sys = `Kamu AI Writing Buddy untuk siswa Indonesia yang belajar Recount Text. ATURAN KETAT: 1) JANGAN tulis cerita utuh untuk siswa. 2) Beri saran, koreksi, contoh singkat. 3) Bantu siswa temukan kesalahannya sendiri. 4) Fokus Simple Past Tense, Regular/Irregular Verbs, struktur Orientation-Events-Reorientation. 5) Jawab Bahasa Indonesia yang ramah & singkat.`;
    if(!s.aiKey) throw new Error('AI belum tersedia. Hubungi admin.');
    if(s.aiProvider === 'gemini'){
      const m = s.aiModel || 'gemini-3.5-flash-lite';
      const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent?key=${s.aiKey}`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],systemInstruction:{parts:[{text:sys}]}})
      });
      const j = await r.json();
      if(j.error) throw new Error(j.error.message);
      return j.candidates?.[0]?.content?.parts?.[0]?.text || '(kosong)';
    }else{
      const m = s.aiModel || 'openai/gpt-oss-120b';
      const r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.aiKey},
        body:JSON.stringify({model:m,messages:[{role:'system',content:sys},{role:'user',content:prompt}],temperature:.7})
      });
      const j = await r.json();
      if(j.error) throw new Error(j.error.message);
      return j.choices?.[0]?.message?.content || '(kosong)';
    }
  }
};

const V1_SET=new Set(VERBS.map(v=>v[0]));
const V2_SET=new Set(VERBS.map(v=>v[1]));
function analyzeText(text){
  const words=(text.toLowerCase().match(/[a-z']+/g)||[]);
  const v2Found=new Set(),v1Warnings=new Set();
  words.forEach(w=>{if(V2_SET.has(w))v2Found.add(w);else if(V1_SET.has(w))v1Warnings.add(w)});
  return {words:words.length,v2Found:[...v2Found],v1Warnings:[...v1Warnings]};
}
function getV1FromV2(v2){const found=VERBS.find(v=>v[1]===v2);return found?found[0]:null}
function renderHighlightedText(text){
  const lines=text.split(/\n+/);
  return lines.map(line=>{
    if(!line.trim()) return '<br><br>';
    return line.replace(/\b([a-zA-Z]+)\b/g,w=>{
      const lower=w.toLowerCase();
      if(V2_SET.has(lower)){
        const v1=getV1FromV2(lower)||lower;
        return `<em data-v1="${v1}" data-v2="${lower}">${w}</em>`;
      }
      return w;
    });
  }).join('<br>');
}

/* ============================================================
   DRAG & DROP GAME
============================================================ */
const DD_POOL=[
  {v:'played',t:'Regular'},{v:'went',t:'Irregular'},{v:'visited',t:'Regular'},
  {v:'ate',t:'Irregular'},{v:'watched',t:'Regular'},{v:'saw',t:'Irregular'},
  {v:'studied',t:'Regular'},{v:'took',t:'Irregular'},{v:'cleaned',t:'Regular'},
  {v:'gave',t:'Irregular'}
];
function renderDragDrop(t1){
  if(!State._ddItems) State._ddItems=[...DD_POOL].sort(()=>Math.random()-.5);
  const items=State._ddItems;
  const placed=State._ddPlaced||{Regular:[],Irregular:[]};
  const used=[...placed.Regular,...placed.Irregular];
  return `<div class="card mb-4">
    <div class="flex between center mb-3 wrap gap-2">
      <div class="badge badge-primary"><i class="fa-solid fa-hand-pointer"></i> Drag & Drop</div>
      ${t1.ddScore>0?`<span class="badge ${t1.ddScore>=80?'badge-success':'badge-warning'}">Skor: ${t1.ddScore}</span>`:''}
    </div>
    <div class="section-sub">Klik kata, lalu klik kotak tujuan.</div>
    <div class="dd-items" id="ddItems">${items.map(it=>`<div class="dd-item ${used.includes(it.v)?'used':''}" data-v="${it.v}" data-t="${it.t}" onclick="pickDD(this)">${it.v}</div>`).join('')}</div>
    <div class="dd-wrap">
      <div class="dd-zone regular" id="zoneRegular" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropDD(event,'Regular')" onclick="dropToZone('Regular')">
        <h4><i class="fa-solid fa-circle" style="font-size:8px;"></i> REGULAR</h4>
        <div>${placed.Regular.map(v=>`<span class="dd-chip correct">${v}</span>`).join('')}</div>
      </div>
      <div class="dd-zone irregular" id="zoneIrregular" ondragover="event.preventDefault();this.classList.add('drag-over')" ondragleave="this.classList.remove('drag-over')" ondrop="dropDD(event,'Irregular')" onclick="dropToZone('Irregular')">
        <h4><i class="fa-solid fa-circle" style="width:8px;height:8px;background:var(--warning);border-radius:2px;display:inline-block;"></i> IRREGULAR</h4>
        <div>${placed.Irregular.map(v=>`<span class="dd-chip correct">${v}</span>`).join('')}</div>
      </div>
    </div>
    <div class="flex gap-2 mt-4 wrap">
      <button class="btn btn-primary" onclick="checkDD()" ${used.length<items.length?'disabled':''}><i class="fa-solid fa-check"></i> Cek</button>
      <button class="btn btn-ghost" onclick="resetDD()"><i class="fa-solid fa-rotate"></i> Ulangi</button>
    </div>
  </div>`;
}
function pickDD(el){
  if(el.classList.contains('used')) return;
  document.querySelectorAll('.dd-item').forEach(e=>e.classList.remove('dragging'));
  el.classList.add('dragging');
  State._pickedDD=el;
}
function dropToZone(zone){
  const el=State._pickedDD; if(!el) return;
  const v=el.dataset.v;
  State._ddPlaced=State._ddPlaced||{Regular:[],Irregular:[]};
  if(!State._ddPlaced[zone].includes(v)) State._ddPlaced[zone].push(v);
  el.classList.remove('dragging');
  State._pickedDD=null;
  render();
}
function dropDD(e,zone){ e.preventDefault(); const z=document.getElementById('zone'+zone); if(z) z.classList.remove('drag-over'); dropToZone(zone); }
function checkDD(){
  const placed=State._ddPlaced||{Regular:[],Irregular:[]};
  const all=[...placed.Regular,...placed.Irregular];
  const correct=all.filter(v=>{
    const item=DD_POOL.find(p=>p.v===v);
    return item&&((placed.Regular.includes(v)&&item.t==='Regular')||(placed.Irregular.includes(v)&&item.t==='Irregular'));
  }).length;
  const score=Math.round(correct/all.length*100);
  if(score>U().t1.ddScore) setU(u=>u.t1.ddScore=score);
  toast(`Score: ${score} (${correct}/${all.length})`,score>=80?'fa-trophy':'fa-info-circle');
  checkBadges(); render();
}
function resetDD(){ State._ddPlaced={Regular:[],Irregular:[]}; State._ddItems=[...DD_POOL].sort(()=>Math.random()-.5); State._pickedDD=null; render(); }

   CONJUGATION
============================================================ */
const CONJ_Q=[
  {s:'Yesterday, I ___ (go) to the market.',a:'went'},
  {s:'She ___ (eat) fried rice this morning.',a:'ate'},
  {s:'They ___ (play) football last Sunday.',a:'played'},
  {s:'We ___ (see) a beautiful rainbow.',a:'saw'},
  {s:'He ___ (study) hard for the exam.',a:'studied'}
];
function renderConjugation(t1){
  if(State._conjIdx===undefined) State._conjIdx=0;
  const i=State._conjIdx;
  if(i>=CONJ_Q.length){
    return `<div class="card text-center">
      <div class="badge badge-primary mb-3"><i class="fa-solid fa-bolt"></i> Conjugation</div>
      <h2 style="font-size:22px;margin:14px 0;">Selesai! 🎉</h2>
      <div style="font-size:44px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">${t1.conjScore}%</div>
      <p class="text-sm text-muted mb-4">Skor tertinggi</p>
      <button class="btn btn-primary" onclick="State._conjIdx=0;State._conjCorrect=0;render()"><i class="fa-solid fa-rotate"></i> Ulangi</button>
    </div>`;
  }
  const q=CONJ_Q[i];
  return `<div class="card">
    <div class="flex between center mb-3"><div class="badge badge-primary"><i class="fa-solid fa-bolt"></i> Conjugation</div><span class="text-sm text-muted">${i+1}/${CONJ_Q.length}</span></div>
    <div class="section-sub">Isi dengan V2 yang tepat.</div>
    <div class="quiz-text" style="font-size:15px;">${q.s}</div>
    <input class="input mb-3" id="conjInput" placeholder="Tulis V2..." onkeydown="if(event.key==='Enter')checkConj()">
    <button class="btn btn-primary" onclick="checkConj()"><i class="fa-solid fa-check"></i> Jawab</button>
    <button class="btn btn-ghost" onclick="State._conjIdx++;render()"><i class="fa-solid fa-forward"></i> Lewati</button>
  </div>`;
}
function checkConj(){
  const inp=document.getElementById('conjInput'); if(!inp) return;
  const val=inp.value.trim().toLowerCase();
  const q=CONJ_Q[State._conjIdx];
  if(val===q.a){ toast('✓','fa-check'); State._conjCorrect=(State._conjCorrect||0)+1; }
  else toast(`✗ ${q.a}`,'fa-xmark');
  State._conjIdx++;
  if(State._conjIdx>=CONJ_Q.length){
    const score=Math.round((State._conjCorrect||0)/CONJ_Q.length*100);
    if(score>U().t1.conjScore) setU(u=>u.t1.conjScore=score);
    checkBadges();
  }
  render();
}

const QUIZ=[
  {q:'Bagian "Last holiday, my family went to Bali." termasuk struktur apa?',opts:['Orientation','Events','Re-orientation'],a:0},
  {q:'Kata kerja manakah yang berbentuk Past Tense (V2)?',opts:['go','went','going'],a:1},

function getActiveQuiz(){
  if(State.aiGenerated && State.aiGenerated.quizzes && State.aiGenerated.quizzes.length){
    return State.aiGenerated.quizzes;
  }
  return QUIZ;
}
function renderQuiz(){
  const q=U().quiz;
  const quiz=getActiveQuiz();
  return quiz.map((item,i)=>{
    const sel=q.answers[i];
    const ans=sel!==undefined && sel!==null;
    return `<div class="mb-4"><div style="font-weight:600;margin-bottom:9px;">${i+1}. ${item.q}</div>
      ${item.opts.map((o,j)=>{let c='quiz-option';if(ans){if(j===item.a)c+=' correct';else if(j===sel)c+=' wrong'}return `<div class="${c}" onclick="answerQuiz(${i},${j})">${String.fromCharCode(65+j)}. ${o}</div>`}).join('')}
    </div>`;
  }).join('');
}
function answerQuiz(i,j){
  const q=U().quiz; q.answers[i]=j;
  const quiz=getActiveQuiz();
  q.score=quiz.filter((it,k)=>q.answers[k]===it.a).length;
  if(q.score>=Math.ceil(quiz.length*0.6)) q.passed=true;
  if(q.passed) U().progress.temukan=true;
  save(); checkBadges(); render();
}
function resetQuiz(){ setU(u=>{u.quiz={answers:[],passed:false,score:0};u.progress.temukan=u.t1.readingDone&&u.t1.grammarDone}); render(); toast('Reset','fa-rotate'); }

async function sendChat(){
  const inp=document.getElementById('chatInput'); if(!inp) return;
  const txt=inp.value.trim(); if(!txt) return;
  State._chat=State._chat||[];
  State._chat.push({role:'user',text:txt}); inp.value='';
  document.getElementById('chatBody').innerHTML=renderChat();
  document.getElementById('chatBody').scrollTop=999999;
  State._chat.push({role:'ai',text:'⏳...'});
  document.getElementById('chatBody').innerHTML=renderChat();
  document.getElementById('chatBody').scrollTop=999999;
  try{
    const reply=await AI.chat(txt);
    State._chat[State._chat.length-1]={role:'ai',text:reply};
  }catch(e){
    State._chat[State._chat.length-1]={role:'ai',text:'❌ Error: '+e.message};
  }
  document.getElementById('chatBody').innerHTML=renderChat();
  document.getElementById('chatBody').scrollTop=999999;
}

/* ============================================================
   AUDIO RECORDING
============================================================ */
let mediaRec,chunks=[],recTimer,recSec=0;
async function toggleRecord(){
  if(State._recording){ mediaRec.stop(); clearInterval(recTimer); State._recording=false; return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    mediaRec=new MediaRecorder(stream); chunks=[]; recSec=0;
    mediaRec.ondataavailable=e=>chunks.push(e.data);
    mediaRec.onstop=async()=>{
      const blob=new Blob(chunks,{type:'audio/webm'});
      let url=null;
      if(sb){
        try{
          const fileName=`audio-${U().id}-${Date.now()}.webm`;
          const up = await Supabase.uploadFile('karya', fileName, blob);
          if(up.ok) url = up.url;
        }catch(e){ console.warn('Upload failed, fallback to base64',e.message); }
      }
      if(url){
        setU(u=>{u.t4.audio=url; u.t4.audioDur=recSec});
        render(); toast('🎙️ Uploaded','fa-cloud-arrow-up'); checkBadges();
      } else {
        const r=new FileReader();
        r.onload=e=>{ setU(u=>{u.t4.audio=e.target.result; u.t4.audioDur=recSec}); render(); toast('🎙️','fa-microphone'); checkBadges(); };
        r.readAsDataURL(blob);
      }
      stream.getTracks().forEach(tr=>tr.stop());
    };
    mediaRec.start(); State._recording=true;
    recTimer=setInterval(()=>{
      recSec++;
      const el=document.getElementById('recTime');
      if(el) el.textContent=`${String(Math.floor(recSec/60)).padStart(2,'0')}:${String(recSec%60).padStart(2,'0')}`;
    },1000);
    render();
  }catch(e){ toast('Mic denied','fa-microphone-slash'); }
}

   ATTACHMENT
============================================================ */
function handleAttachFiles(files){ processAttach(Array.from(files)); }
function handleAttachDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drag-over'); processAttach(Array.from(e.dataTransfer.files)); }
async function processAttach(files){
  const MAX=2*1024*1024, MAXF=3;
  const u=U();
  const existing=u.t4.attachments?u.t4.attachments.length:0;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    if(existing+i>=MAXF){ toast(`Max ${MAXF} files`,'fa-triangle-exclamation'); continue; }
    if(f.size>MAX){ toast(`${f.name} >2MB`,'fa-triangle-exclamation'); continue; }
    let url=null;
    if(sb){
      try{
        const fileName=`att-${U().id}-${Date.now()}-${f.name}`;
        const up = await Supabase.uploadFile('karya', fileName, f);
        if(up.ok) url = up.url;
      }catch(e){ console.warn('Upload failed',e.message); }
    }
    if(url){
      setU(u=>{
        if(!u.t4.attachments) u.t4.attachments=[];
        u.t4.attachments.push({name:f.name, size:f.size, type:f.type, url});
      });
    } else {
      await new Promise(resolve=>{
        const r=new FileReader();
        r.onload=e=>{
          setU(u=>{
            if(!u.t4.attachments) u.t4.attachments=[];
            u.t4.attachments.push({name:f.name, size:f.size, type:f.type, data:e.target.result});
          });
          resolve();
        };
        r.readAsDataURL(f);
      });
    }
    checkBadges();
  }
  render();
}
function removeAttachment(i){ setU(u=>u.t4.attachments.splice(i,1)); render(); }

function filterVerbs(q,type){
  State._verbType=type;
  q=(q||'').toLowerCase().trim();
  let list=VERBS;
  if(type&&type!=='all') list=list.filter(v=>v[3]===type);
  if(q) list=list.filter(v=>v.some((f,i)=>i<3&&f.toLowerCase().includes(q)));
  const b=document.getElementById('verbBody'); if(!b) return;
  b.innerHTML=renderVerbRows(list);
  document.querySelectorAll('.card .btn-sm').forEach(btn=>{
    const txt=btn.textContent.trim();
    if(['Semua','Regular','Irregular','All'].includes(txt)){
      const match=(txt==='Semua'||txt==='All')?(type==='all'||!type):(txt===type);
      btn.className=match?'btn btn-primary btn-sm':'btn btn-ghost btn-sm';
    }
  });
}

function handleExcelImport(file){
  if(!file) return;
  if(typeof XLSX==='undefined') return toast('Library XLSX belum load','fa-triangle-exclamation');
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const data=new Uint8Array(e.target.result);
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{defval:''});
      if(!rows.length) throw new Error('File kosong');
      const keys=Object.keys(rows[0]);
      const hasNama=keys.some(k=>k.toLowerCase()==='nama');
      if(!hasNama) throw new Error('Kolom "Nama" tidak ditemukan');
      let added=0, updated=0;
      rows.forEach(r=>{
        const name=(r['Nama']||r['nama']||'').toString().trim();
        if(!name) return;
        const nip=(r['NIP/NIS']||r['NIP']||r['NIS']||'').toString().trim();
        const kelas=(r['Kelas']||r['kelas']||'').toString().trim();
        const sekolah=(r['Sekolah']||r['sekolah']||'').toString().trim();
        const role=(r['Role']||r['role']||'student').toString().trim().toLowerCase();
        const existing=Object.values(State.users).find(u=>u.profile.name.toLowerCase()===name.toLowerCase()&&(!nip||u.profile.nip===nip));
        if(existing){
          if(nip) existing.profile.nip=nip;
          if(kelas) existing.profile.classes=kelas;
          if(sekolah) existing.profile.school=sekolah;
          existing.profile.role=(role==='teacher'||role==='guru')?'teacher':'student';
          updated++;
        }else{
          const id=uid();
          const newUser=safeClone(DEFAULT_USER);
          newUser.id=id;
          newUser.profile.name=name;
          newUser.profile.nip=nip;
          newUser.profile.classes=kelas;
          newUser.profile.school=sekolah;
          newUser.profile.role=(role==='teacher'||role==='guru')?'teacher':'student';
          newUser.profile.avatar=newUser.profile.role==='teacher'?'👨‍🏫':'🧑‍🎓';
          State.users[id]=newUser;
          added++;
        }
      });
      save(); closeModal(); render();
      toast(`✓ ${added} ditambahkan, ${updated} diupdate`,'fa-file-excel');
    }catch(err){ toast('Error: '+err.message,'fa-xmark'); }
  };
  reader.readAsArrayBuffer(file);
}

  const a=analyzeText(c);
  const done=Object.values(u.progress||{}).filter(Boolean).length;
  openModal(`${u.profile.avatar||'👤'} ${esc(u.profile.name||'No Name')}`,`
    <div class="flex between center mb-3"><span class="badge badge-primary">${done}/4</span><span class="badge badge-warning">${(u.badges||[]).length} badges</span></div>
    <div class="text-sm mb-3"><b>Sekolah:</b> ${esc(u.profile.school||'-')}</div>
    <div class="text-sm mb-3"><b>Kelas:</b> ${esc(u.profile.classes||'-')}</div>
    <div class="text-sm mb-3"><b>Kata:</b> ${a.words} · <b>V2:</b> ${a.v2Found.length}</div>
    <div style="background:var(--bg);padding:14px;border-radius:10px;font-size:13px;line-height:1.7;max-height:300px;overflow:auto;white-space:pre-wrap;">${esc(c||'(empty)')}</div>
  `,`<button class="btn btn-ghost" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="switchUser('${id}');closeModal()">Switch</button>`);
}

/* ============================================================
   AI GENERATOR HANDLERS
============================================================ */
async function generateReading(ev){
  const topic=document.getElementById('genTopic').value;
  const words=document.getElementById('genWords').value;
  const topicLabel={holiday:'holiday/vacation',school:'school event',family:'family moment',funny:'funny experience',competition:'competition'}[topic];
  const btn=ev.target; btn.disabled=true; const orig=btn.innerHTML; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ...';
  try{
    const prompt=`Write a Recount Text in English about "${topicLabel}" with approximately ${words} words. Structure: Orientation - Events (3+) - Re-orientation. Use SIMPLE PAST TENSE (V2) consistently. Return ONLY the recount text, no title, no markdown.`;
    const result=await AI.chat(prompt);
    document.getElementById('genReadingText').value=result.trim();
    toast('✓ Generated','fa-check');
  }catch(e){ toast('Error: '+e.message,'fa-xmark'); }
  finally{ btn.disabled=false; btn.innerHTML=orig; }
}
async function saveReading(){
  const text=document.getElementById('genReadingText').value.trim();
  if(!text) return toast('Empty','fa-triangle-exclamation');
  State.materials.readingText=text; save();
  if(sb){
    await Supabase.saveMaterials({
      readingText: text,
      quizzes: State.aiGenerated?.quizzes || [],
      videoUrl: State.materials.videoUrl,
      videoTitle: State.materials.videoTitle
    });
  }
  toast('✓ Saved & synced','fa-cloud-arrow-up'); render();
}
function clearReading(){
  if(!confirm('Hapus teks bacaan?')) return;
  State.materials.readingText=''; save(); render();
  toast('Cleared','fa-trash');
}
async function generateQuiz(ev){
  const text=State.materials.readingText;
  if(!text) return toast('No reading text','fa-triangle-exclamation');
  const btn=ev.target; btn.disabled=true; const orig=btn.innerHTML; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ...';
  try{
    const prompt=`Based on this Recount Text:\n\n${text}\n\nCreate exactly 5 multiple-choice questions in Indonesian about: (1) structure, (2) past tense verb, (3) comprehension, (4) vocabulary, (5) main idea. Each question 3 options (A/B/C). Return ONLY JSON: [{"q":"...","opts":["A","B","C"],"a":0},...]`;
    const result=await AI.chat(prompt);
    let clean=result.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const match=clean.match(/\[[\s\S]*\]/);
    if(!match) throw new Error('Invalid JSON');
    const parsed=JSON.parse(match[0]);
    State.aiGenerated=State.aiGenerated||{};
    State.aiGenerated.quizzes=parsed; save();
    if(sb){
      await Supabase.saveMaterials({
        readingText: State.materials.readingText,
        quizzes: parsed,
        videoUrl: State.materials.videoUrl,
        videoTitle: State.materials.videoTitle
      });
    }
    toast('✓ Quiz generated & synced','fa-check'); render();
  }catch(e){ toast('Error: '+e.message,'fa-xmark'); }
  finally{ btn.disabled=false; btn.innerHTML=orig; }
}
function updateGeneratedQuestion(i,field,val){
  const qs=State.aiGenerated.quizzes;
  if(field==='q') qs[i].q=val;
  else if(field==='a') qs[i].a=val;
  else if(field.startsWith('opt')){ const j=parseInt(field.replace('opt','')); qs[i].opts[j]=val; }
  save();
}
function deleteGeneratedQuestion(i){ State.aiGenerated.quizzes.splice(i,1); save(); render(); }
function clearQuiz(){
  if(!confirm('Hapus kuis?')) return;
  State.aiGenerated.quizzes=[]; save(); render();
  toast('Cleared','fa-trash');
}
async function generateVerbs(ev){
  const btn=ev.target; btn.disabled=true; const orig=btn.innerHTML; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> ...';
  document.getElementById('genVerbsResult').innerHTML='<div class="text-sm text-muted">⏳ Generating...</div>';
  try{
    const prompt=`Give me 10 English verbs commonly used in Recount Text NOT in: go, eat, see, take, come, get, make, do, have, say. Mix 5 regular + 5 irregular. Return ONLY JSON: [{"v1":"base","v2":"past","v3":"participle","type":"Regular"},...]`;
    const result=await AI.chat(prompt);
    let clean=result.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'').trim();
    const match=clean.match(/\[[\s\S]*\]/);
    if(!match) throw new Error('Invalid JSON');
    const verbs=JSON.parse(match[0]);
    State._genVerbBuffer=verbs;
    document.getElementById('genVerbsResult').innerHTML=`
      <div class="mb-3"><span class="badge badge-success">${verbs.length} verbs</span></div>
      ${verbs.map(v=>`<div class="dd-chip" style="margin:4px;">${esc(v.v1)} → <b>${esc(v.v2)}</b> → ${esc(v.v3)}</div>`).join('')}
      <div class="mt-3"><button class="btn btn-primary btn-sm" onclick="addGeneratedVerbs()"><i class="fa-solid fa-plus"></i> Tambah Semua</button></div>
    `;
  }catch(e){
    document.getElementById('genVerbsResult').innerHTML=`<div class="tense-alert">Error: ${esc(e.message)}</div>`;
  }finally{ btn.disabled=false; btn.innerHTML=orig; }
}
function addGeneratedVerbs(){
  const verbs=State._genVerbBuffer||[];
  let added=0;
  verbs.forEach(v=>{
    if(!VERBS.find(x=>x[0]===v.v1)){
      VERBS.push([v.v1,v.v2,v.v3,v.type]);
      V1_SET.add(v.v1); V2_SET.add(v.v2);
      added++;
    }
  });
  save();
  toast(`✓ ${added} verbs added`,'fa-check');
  document.getElementById('genVerbsResult').innerHTML=`<div class="tense-alert">✅ ${added} verbs ditambahkan.</div>`;
}
